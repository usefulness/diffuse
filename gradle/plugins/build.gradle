import org.gradle.kotlin.dsl.ProjectExtensionsKt
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
  id 'java-gradle-plugin'
  alias(libs.plugins.kotlin.jvm)
  alias(libs.plugins.kotlin.sam.with.receiver)
}

samWithReceiver {
  annotation("org.gradle.api.HasImplicitReceiver")
}

def buildLogicTarget = JavaVersion.VERSION_17

kotlin {
  jvmToolchain(libs.versions.java.compilation.get().toInteger())
  compilerOptions.jvmTarget = JvmTarget.fromTarget(buildLogicTarget.toString())
}

tasks.withType(JavaCompile).configureEach {
  options.release.set(buildLogicTarget.majorVersion.toInteger())
}

dependencies {
  implementation(ProjectExtensionsKt.gradleKotlinDsl(project))
  implementation("org.jetbrains.kotlin:kotlin-gradle-plugin")
  implementation(libs.ktlint.gradle)
  implementation(gradleApi())
}

gradlePlugin {
  plugins {
    publishingPlugin {
      id = 'setup-compilation'
      implementationClass = 'SetupCompilationPlugin'
    }
  }
}
